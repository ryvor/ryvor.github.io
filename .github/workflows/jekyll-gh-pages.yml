name: Deploy Jekyll site

on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site

      - name: Diagnose Jekyll output
        run: |
          ruby -v
          bundle -v
          bundle exec jekyll -v
          git branch --show-current
          ls -la
          ls -la ./_site
          find ./_site -maxdepth 3 -name "*.html" -print
          test -f ./_site/index.html && echo "✅ index.html exists" || (echo "❌ index.html missing" && exit 1)
          test -f ./_site/CNAME && cat ./_site/CNAME || echo "No CNAME found"
          du -sh ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
